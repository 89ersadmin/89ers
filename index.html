<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>89ers Online Diners</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="89ers">
  <meta name="application-name" content="89ers">
  <meta name="theme-color" content="#1A0A00">
  <meta name="description" content="89ers Online Diners - Homestyle Filipino cuisine, ordered from anywhere in Iloilo.">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1A0A00; width: 100vw; height: 100vh; overflow: hidden; }

    #splash {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #1a1a00 0%, #1A0A00 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999; transition: opacity 0.6s ease;
    }

    #splash .logo-wrap {
      position: relative;
      width: 160px; height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    #splash .logo-wrap::before {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #D4A017;
      border-right-color: #D4A017;
      animation: spin 2s linear infinite;
    }
    #splash .logo-wrap::after {
      content: '';
      position: absolute; inset: -14px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #B8860B;
      border-left-color: #B8860B;
      animation: spin 3s linear infinite reverse;
    }
    #splash img {
      width: 150px; height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 3px #D4A017, 0 0 40px rgba(212,160,23,0.5), 0 10px 40px rgba(0,0,0,0.8);
      animation: pulse 2s ease-in-out infinite;
    }
    #splash .app-name {
      color: #D4A017;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 36px; font-weight: 900;
      margin-top: 28px; letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(212,160,23,0.6), 0 2px 8px rgba(0,0,0,0.8);
    }
    #splash .app-sub {
      color: rgba(212,160,23,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; font-weight: 500;
      margin-top: 6px; letter-spacing: 4px; text-transform: uppercase;
    }
    #splash .loading-bar-wrap {
      margin-top: 36px; width: 180px; height: 3px;
      background: rgba(212,160,23,0.15);
      border-radius: 4px; overflow: hidden;
    }
    #splash .loading-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #D4A017, #B8860B);
      border-radius: 4px;
      animation: loadbar 4s ease-in-out forwards;
      box-shadow: 0 0 10px rgba(212,160,23,0.8);
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loadbar { 0%{width:0%} 40%{width:60%} 80%{width:85%} 100%{width:100%} }

    #app-frame {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; z-index: 1;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="logo-wrap">
      <img src="icons/icon-192.png" alt="89ers Online Diners">
    </div>
    <div class="app-name">89ers</div>
    <div class="app-sub">Online Diners</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbz0Dc-6RGbqmvll4GTj6goYNXIYLFumaZ0a8lmSBN_Aai9jfsSm1rPiw0MvpCzSH7Opag/exec"
    allow="fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) { console.log('SW registered:', reg.scope); })
          .catch(function(err) { console.log('SW failed:', err); });
      });
    }

    var frame = document.getElementById("app-frame");
    var splash = document.getElementById("splash");

    frame.onload = function() {
      setTimeout(function() {
        splash.style.opacity = "0";
        setTimeout(function() { splash.style.display = "none"; }, 600);
      }, 1000);
    };

    setTimeout(function() {
      splash.style.opacity = "0";
      setTimeout(function() { splash.style.display = "none"; }, 600);
    }, 5000);
  </script>

</body>
</html>
